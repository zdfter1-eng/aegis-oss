
name = "aegis-oss"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/mcp*",
  "/authorize",
  "/token",
  "/register",
  "/health",
  "/pulse",
  "/dashboard",
  "/chat/ws",
  "/agents/*",
  "/.well-known/*",
  "/webhooks/*"
]

[[d1_databases]]
binding = "DB"
database_name = "aegis-db"
database_id = "c5a0f058-8249-4571-b3e2-ed6a46f5652c"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[durable_objects.bindings]]
name = "AegisVoiceAdapter"
class_name = "AegisVoiceAdapter"

[[migrations]]
tag = "v1-chat-session"
new_sqlite_classes = ["ChatSession"]

[[migrations]]
tag = "v2-aegis-voice-adapter"
new_sqlite_classes = ["AegisVoiceAdapter"]

[vars]
WORKERS_AI_MODEL = "@cf/deepseek-ai/deepseek-v4.1-flash-1017"

[triggers]
crons = ["0 * * * *"]
